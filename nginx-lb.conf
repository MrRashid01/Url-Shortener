# A small "edge cache", like one CDN node
proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:10m max_size=100m inactive=10m use_temp_path=off;

# Docker's built-in DNS: re-check the servers' addresses every 5 seconds
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;

  # A variable makes nginx look the name up at request time, not only at startup
  set $backend http://server:5000;

  location / {
    proxy_pass $backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_next_upstream error timeout http_502 http_503;

    proxy_cache edge;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_lock on;

    add_header X-Upstream $upstream_addr always;
    add_header X-Cache-Status $upstream_cache_status always;
  }
}