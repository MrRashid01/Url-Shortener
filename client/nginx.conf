server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: any unknown path should load index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built files have unique names, so browsers may keep them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}