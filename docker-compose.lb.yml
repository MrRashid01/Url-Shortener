services:
  postgres:
    image: postgres:16-alpine
    container_name: urlshortener-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener_pass
      POSTGRES_DB: shortener
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No container_name and no host port: Docker can make many copies of this
  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://shortener:shortener_pass@postgres:5432/shortener?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Put JWT_SECRET in the .env file next to this file}
      BASE_URL: http://localhost:8000
      CLIENT_URL: http://localhost:8080
      CROSS_SITE_COOKIES: "false"
      REDIRECT_STATUS: ${REDIRECT_STATUS:-302}
      REDIRECT_CDN_CACHE_SECONDS: ${REDIRECT_CDN_CACHE_SECONDS:-0}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  lb:
    image: nginx:alpine
    container_name: urlshortener-lb
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000
    container_name: urlshortener-client
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata: